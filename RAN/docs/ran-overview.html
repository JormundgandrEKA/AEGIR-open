<!doctype html><html lang="en"><head><meta charset="utf-8"><title>RAN overview</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0;padding:16px;background:#fff;color:#111;font:14px "Segoe UI",Arial,sans-serif}
svg{width:100%;height:auto;max-width:1200px;display:block;margin:0 auto 24px;border:1px solid #111}
h1{font-size:18px;margin:0 0 12px}</style></head><body>
<h1>RÁN overview: how it works, and what exists and what is next</h1>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t d">
  <title id="t">RÁN: how it works</title>
  <desc id="d">Five stages: public sources, a rate-limited fetch layer, an append-only store, derived flags and grades, and batches with a labelling app. Cowork design reads the files at the end.</desc>
  <style>
    text{font-family:"Segoe UI",Arial,sans-serif;fill:#111}
    .mono{font-family:Consolas,"DejaVu Sans Mono",monospace}
    .h{font-size:13px;font-weight:700;letter-spacing:.06em}
    .b{font-size:13px}
    .s{font-size:12px;fill:#444}
    .box{fill:#fff;stroke:#111;stroke-width:1.2}
    .head{fill:#111}
    .headt{fill:#fff;font-size:13px;font-weight:700;letter-spacing:.06em}
    .arrow{stroke:#111;stroke-width:1.6;fill:none;marker-end:url(#a)}
    .acc{fill:#0040ff}
    .chip{fill:#f3f3f3;stroke:#111;stroke-width:1}
    .band{fill:#f3f3f3;stroke:#111;stroke-width:1.2}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#111"/></marker></defs>
  <rect width="1200" height="600" fill="#fff"/>
  <text x="20" y="32" font-size="22" font-weight="700">RÁN: how it works</text>
  <text x="20" y="52" class="s">Registry and Article Net. Fetch public data, keep it unchanged and traceable, flag what changed, help a human label it.</text>

  <!-- column heads -->
  <g>
    <rect x="20" y="72" width="190" height="26" class="head"/><text x="30" y="90" class="headt">1 SOURCES</text>
    <rect x="250" y="72" width="200" height="26" class="head"/><text x="260" y="90" class="headt">2 FETCH LAYER</text>
    <rect x="490" y="72" width="200" height="26" class="head"/><text x="500" y="90" class="headt">3 STORE</text>
    <rect x="730" y="72" width="210" height="26" class="head"/><text x="740" y="90" class="headt">4 DERIVE</text>
    <rect x="980" y="72" width="200" height="26" class="head"/><text x="990" y="90" class="headt">5 LABEL</text>
  </g>

  <!-- 1 sources -->
  <g>
    <rect x="20" y="98" width="190" height="318" class="box"/>
    <text x="30" y="122" class="b" font-weight="600">ClinicalTrials.gov</text><text x="30" y="139" class="s">API v2: search, records</text>
    <text x="30" y="170" class="b" font-weight="600">Registry history</text><text x="30" y="187" class="s">version indexes and versions,</text><text x="30" y="203" class="s">collected in your browser</text>
    <text x="30" y="234" class="b" font-weight="600">PubMed</text><text x="30" y="251" class="s">E-utilities: search, articles</text>
    <text x="30" y="282" class="b" font-weight="600">PMC</text><text x="30" y="299" class="s">licence per article, full text</text>
    <text x="30" y="330" class="b" font-weight="600">Europe PMC</text><text x="30" y="347" class="s">licence, one PMID per request</text>
    <text x="30" y="395" class="s">Public, free, graded A+ to F</text>
  </g>
  <path class="arrow" d="M210 257H246"/>

  <!-- 2 fetch layer -->
  <g>
    <rect x="250" y="98" width="200" height="318" class="box"/>
    <text x="260" y="122" class="b">Rate limits kept across</text><text x="260" y="139" class="b">processes (state/rate.json)</text>
    <text x="260" y="168" class="b">Request budget per command</text><text x="260" y="185" class="s">default 500; --dry-run first</text>
    <text x="260" y="214" class="b">NCBI weekday-daytime guard</text>
    <text x="260" y="243" class="b">Retry and back-off</text><text x="260" y="260" class="s">429, 5xx, truncated reads</text>
    <text x="260" y="289" class="b">API key and email redacted</text><text x="260" y="306" class="s">from every URL, log, output</text>
    <text x="260" y="335" class="b">Fetched text is data,</text><text x="260" y="352" class="b">never instructions</text>
    <text x="260" y="395" class="s">One JSON summary per command</text>
  </g>
  <path class="arrow" d="M450 257H486"/>

  <!-- 3 store -->
  <g>
    <rect x="490" y="98" width="200" height="318" class="box"/>
    <text x="500" y="122" class="b" font-weight="600">data/raw/…</text><text x="500" y="139" class="s">files as received, dated</text>
    <text x="500" y="168" class="b" font-weight="600">.meta.json sidecar</text><text x="500" y="185" class="s">url, time, sha256, grade,</text><text x="500" y="201" class="s">how collected</text>
    <text x="500" y="230" class="b" font-weight="600">catalogue/*.jsonl</text><text x="500" y="247" class="s">append-only; latest line wins</text>
    <text x="500" y="276" class="b" font-weight="600">derived/</text><text x="500" y="293" class="s">tables, flags, audits</text>
    <text x="500" y="322" class="b" font-weight="600">labels/</text><text x="500" y="339" class="s">per labeller, never shared</text>
    <rect x="500" y="356" width="180" height="46" class="chip"/>
    <text x="508" y="374" class="s">No deletes, no overwrites,</text><text x="508" y="391" class="s">no SQLite, no git in data/</text>
  </g>
  <path class="arrow" d="M690 257H726"/>

  <!-- 4 derive -->
  <g>
    <rect x="730" y="98" width="210" height="318" class="box"/>
    <text x="740" y="122" class="b" font-weight="600">Label flags (T12 rule)</text><text x="740" y="139" class="s">index only: 159 pos, 208 neg</text>
    <text x="740" y="168" class="b" font-weight="600">Content flags v2</text><text x="740" y="185" class="s">amend.py reads the real text</text><text x="740" y="201" class="s">per version vs baseline</text>
    <rect x="740" y="210" width="190" height="62" class="chip"/>
    <text x="748" y="228" class="s">criterion added / removed,</text><text x="748" y="244" class="s">threshold, age/sex, outcome</text><text x="748" y="260" class="s">elements, enrolment, arms</text>
    <text x="740" y="296" class="b" font-weight="600">Licence grades</text><text x="740" y="313" class="s">CC BY = B ... custom = F</text>
    <text x="740" y="342" class="b" font-weight="600">Links, tally, efficiency</text>
    <text x="740" y="395" class="s">Rule-based. No language model.</text>
  </g>
  <path class="arrow" d="M940 257H976"/>

  <!-- 5 label -->
  <g>
    <rect x="980" y="98" width="200" height="318" class="box"/>
    <text x="990" y="122" class="b" font-weight="600">Batch builder</text><text x="990" y="139" class="s">50 positives + matched</text><text x="990" y="155" class="s">negatives, shuffled</text>
    <text x="990" y="184" class="s">10% hide the provisional label</text>
    <text x="990" y="214" class="b" font-weight="600">Labelling app</text><text x="990" y="231" class="s">127.0.0.1 only, keyboard-first</text>
    <text x="990" y="257" class="s">• every changed field shown</text><text x="990" y="273" class="s">• definitions beside options</text><text x="990" y="289" class="s">• provisional label, revealed</text><text x="990" y="305" class="s">  on request, with findings</text><text x="990" y="321" class="s">• always-on notepad, drafts</text>
    <text x="990" y="355" class="b" font-weight="600">Writes</text><text x="990" y="372" class="s mono">gold-label/0.1 + timing</text>
    <text x="990" y="395" class="s">One labeller now; two to confirm</text>
  </g>

  <!-- bottom: flow to Cowork -->
  <path class="arrow" d="M1080 416V458"/>
  <rect x="20" y="460" width="1160" height="64" class="band"/>
  <text x="34" y="484" class="b" font-weight="700">COWORK (design) reads the files:</text>
  <text x="272" y="484" class="b mono">labels.jsonl · sessions/*.jsonl · notepad.jsonl · content_flags*.json · batch_audit*.json · tally · efficiency</text>
  <text x="34" y="508" class="s">…and sends back decisions, new named queries, and rule changes. Anything for the gold set must come from a named query in config/queries/.</text>
  <path class="arrow" d="M240 524V550" style="stroke-dasharray:4 3"/>
  <text x="252" y="560" class="s">decisions loop back to step 1 and step 4</text>

  <!-- chips -->
  <g>
    <rect x="20" y="574" width="170" height="20" class="chip"/><text x="28" y="588" class="s">Standard library only</text>
    <rect x="200" y="574" width="190" height="20" class="chip"/><text x="208" y="588" class="s">RAN.exe is portable</text>
    <rect x="400" y="574" width="260" height="20" class="chip"/><text x="408" y="588" class="s">Every fetched file has provenance</text>
    <rect x="670" y="574" width="250" height="20" class="chip"/><text x="678" y="588" class="s">No language model in the tool</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="t d">
<title id="t">RÁN: capabilities, current and to be built</title>
<desc id="d">Three columns: capabilities built and used on real data, built but not yet proven, and still to build.</desc>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#111}.b{font-size:13.5px;font-weight:600}.s{font-size:12px;fill:#444}.h{font-size:13px;font-weight:700;letter-spacing:.06em;fill:#fff}.k{font-size:12px}</style>
<rect width="1200" height="640" fill="#fff"/>
<text x="20" y="32" font-size="22" font-weight="700">RÁN: what exists and what is next</text>
<text x="20" y="52" class="s">State on 28 Oct 2026. "Used on real data" means run on the COPD pool or on live NCBI, EPMC or labelling sessions, not just tests.</text>
<rect x="20" y="72" width="360" height="26" fill="#0b6b2e"/><text x="30" y="90" class="h">BUILT AND USED ON REAL DATA</text>
<rect x="20" y="98" width="360" height="446" fill="#fff" stroke="#0b6b2e" stroke-width="1.4"/>
<rect x="30" y="112" width="12" height="12" fill="#0b6b2e"/>
<text x="50" y="123" class="b">ClinicalTrials.gov search and records</text><text x="50" y="138" class="s">COPD pool: 433 trials</text>
<rect x="30" y="148" width="12" height="12" fill="#0b6b2e"/>
<text x="50" y="159" class="b">History import, version store</text><text x="50" y="174" class="s">834 browser files, 152 trials with versions</text>
<rect x="30" y="184" width="12" height="12" fill="#0b6b2e"/>
<text x="50" y="195" class="b">Label flags (T12 rule)</text><text x="50" y="210" class="s">reproduces 159 positive / 208 negative</text>
<rect x="30" y="220" width="12" height="12" fill="#0b6b2e"/>
<text x="50" y="231" class="b">Content flags v2 + amend.py</text><text x="50" y="246" class="s">stress-tested: 0-3% false alarms</text>
<rect x="30" y="256" width="12" height="12" fill="#0b6b2e"/>
<text x="50" y="267" class="b">PubMed search and fetch, PMC licence, grades</text><text x="50" y="282" class="s">372 licences checked, B to D-</text>
<rect x="30" y="292" width="12" height="12" fill="#0b6b2e"/>
<text x="50" y="303" class="b">Batch builder and audit</text><text x="50" y="318" class="s">11 randomised batches audited</text>
<rect x="30" y="328" width="12" height="12" fill="#0b6b2e"/>
<text x="50" y="339" class="b">Labelling app (127.0.0.1, keyboard)</text><text x="50" y="354" class="s">31 labels from 1 labeller</text>
<rect x="30" y="364" width="12" height="12" fill="#0b6b2e"/>
<text x="50" y="375" class="b">Definitions on screen, notepad, drafts</text><text x="50" y="390" class="s">timing and event logs written</text>
<rect x="30" y="400" width="12" height="12" fill="#0b6b2e"/>
<text x="50" y="411" class="b">status, tally, efficiency report</text><text x="50" y="426" class="s">run on real data</text>
<rect x="30" y="436" width="12" height="12" fill="#0b6b2e"/>
<text x="50" y="447" class="b">Portable RAN.exe, launcher</text><text x="50" y="462" class="s">opens and serves the app</text>
<rect x="30" y="472" width="12" height="12" fill="#0b6b2e"/>
<text x="50" y="483" class="b">Rate limits, budget, key redaction</text><text x="50" y="498" class="s">700+ requests logged, 0 failed</text>
<rect x="30" y="508" width="12" height="12" fill="#0b6b2e"/>
<text x="50" y="519" class="b">Unit tests: 39 pass; stress test</text><text x="50" y="534" class="s">about 4,500 edits per seed</text>
<rect x="420" y="72" width="360" height="26" fill="#9a6700"/><text x="430" y="90" class="h">BUILT, NOT YET PROVEN</text>
<rect x="420" y="98" width="360" height="338" fill="#fff" stroke="#9a6700" stroke-width="1.4"/>
<rect x="430" y="112" width="12" height="12" fill="#9a6700"/>
<text x="450" y="123" class="b">Europe PMC licence at scale</text><text x="450" y="138" class="s">only 2 PMIDs fetched live</text>
<rect x="430" y="148" width="12" height="12" fill="#9a6700"/>
<text x="450" y="159" class="b">Track 2 article fetch at scale</text><text x="450" y="174" class="s">5 searches done; 96 of 7,361 fetched</text>
<rect x="430" y="184" width="12" height="12" fill="#9a6700"/>
<text x="450" y="195" class="b">link from-registry / from-pubmed</text><text x="450" y="210" class="s">0 links stored so far</text>
<rect x="430" y="220" width="12" height="12" fill="#9a6700"/>
<text x="450" y="231" class="b">PMC full text behind the grade gate</text><text x="450" y="246" class="s">not run live</text>
<rect x="430" y="256" width="12" height="12" fill="#9a6700"/>
<text x="450" y="267" class="b">attribution, snapshot</text><text x="450" y="282" class="s">snapshot omits study files</text>
<rect x="430" y="292" width="12" height="12" fill="#9a6700"/>
<text x="450" y="303" class="b">ctgov history by script</text><text x="450" y="318" class="s">403 by design; import path used</text>
<rect x="430" y="328" width="12" height="12" fill="#9a6700"/>
<text x="450" y="339" class="b">amend.py beyond COPD / outcomes</text><text x="450" y="354" class="s">few real outcome labels</text>
<rect x="430" y="364" width="12" height="12" fill="#9a6700"/>
<text x="450" y="375" class="b">Rules checked by an expert</text><text x="450" y="390" class="s">none yet; my reading of the standards</text>
<rect x="430" y="400" width="12" height="12" fill="#9a6700"/>
<text x="450" y="411" class="b">Linux and Mac runs</text><text x="450" y="426" class="s">only Windows exercised this session</text>
<rect x="820" y="72" width="360" height="26" fill="#b00020"/><text x="830" y="90" class="h">TO BUILD</text>
<rect x="820" y="98" width="360" height="374" fill="#fff" stroke="#b00020" stroke-width="1.4"/>
<rect x="830" y="112" width="12" height="12" fill="#b00020"/>
<text x="850" y="123" class="b">Second labeller, kappa, disagreements</text><text x="850" y="138" class="s">tally counts confirmed only</text>
<rect x="830" y="148" width="12" height="12" fill="#b00020"/>
<text x="850" y="159" class="b">Adjudication screen (Forseti)</text><text x="850" y="174" class="s">for split labels</text>
<rect x="830" y="184" width="12" height="12" fill="#b00020"/>
<text x="850" y="195" class="b">Clean negatives (about 100 more files)</text><text x="850" y="210" class="s">browser collection needed</text>
<rect x="830" y="220" width="12" height="12" fill="#b00020"/>
<text x="850" y="231" class="b">Review the two small Track 2 sets</text><text x="850" y="246" class="s">trials-updates and trials-protocols-copd</text>
<rect x="830" y="256" width="12" height="12" fill="#b00020"/>
<text x="850" y="267" class="b">Expert calibration set</text><text x="850" y="282" class="s">clinician reviews about 30 findings</text>
<rect x="830" y="292" width="12" height="12" fill="#b00020"/>
<text x="850" y="303" class="b">Anchoring report</text><text x="850" y="318" class="s">provisional shown vs hidden</text>
<rect x="830" y="328" width="12" height="12" fill="#b00020"/>
<text x="850" y="339" class="b">Gold-set export with licence gate</text><text x="850" y="354" class="s">redistributable only</text>
<rect x="830" y="364" width="12" height="12" fill="#b00020"/>
<text x="850" y="375" class="b">Second therapeutic area</text><text x="850" y="390" class="s">after track-2 yield</text>
<rect x="830" y="400" width="12" height="12" fill="#b00020"/>
<text x="850" y="411" class="b">Signed exe, Mac/Linux builds</text><text x="850" y="426" class="s">SmartScreen warnings</text>
<rect x="830" y="436" width="12" height="12" fill="#b00020"/>
<text x="850" y="447" class="b">EU CTIS source</text><text x="850" y="462" class="s">graded later</text>
<text x="20" y="582" class="b">Feature completeness against the original design plan</text>
<text x="20" y="600" class="k">Fetch and store</text>
<rect x="20" y="608" width="180" height="10" fill="#eee" stroke="#111" stroke-width="0.8"/><rect x="20" y="608" width="166" height="10" fill="#0040ff"/>
<text x="176" y="600" class="k" text-anchor="end"></text>
<text x="200" y="600" class="k" text-anchor="end">92%</text>
<text x="215" y="600" class="k">Derive and flags</text>
<rect x="215" y="608" width="180" height="10" fill="#eee" stroke="#111" stroke-width="0.8"/><rect x="215" y="608" width="153" height="10" fill="#0040ff"/>
<text x="371" y="600" class="k" text-anchor="end"></text>
<text x="395" y="600" class="k" text-anchor="end">85%</text>
<text x="410" y="600" class="k">Labelling tool</text>
<rect x="410" y="608" width="180" height="10" fill="#eee" stroke="#111" stroke-width="0.8"/><rect x="410" y="608" width="144" height="10" fill="#0040ff"/>
<text x="566" y="600" class="k" text-anchor="end"></text>
<text x="590" y="600" class="k" text-anchor="end">80%</text>
<text x="605" y="600" class="k">Reports and QA</text>
<rect x="605" y="608" width="180" height="10" fill="#eee" stroke="#111" stroke-width="0.8"/><rect x="605" y="608" width="126" height="10" fill="#0040ff"/>
<text x="761" y="600" class="k" text-anchor="end"></text>
<text x="785" y="600" class="k" text-anchor="end">70%</text>
<text x="800" y="600" class="k">Gold-set export</text>
<rect x="800" y="608" width="180" height="10" fill="#eee" stroke="#111" stroke-width="0.8"/><rect x="800" y="608" width="54" height="10" fill="#0040ff"/>
<text x="956" y="600" class="k" text-anchor="end"></text>
<text x="980" y="600" class="k" text-anchor="end">30%</text>
<text x="995" y="600" class="k">Second labeller flow</text>
<rect x="995" y="608" width="180" height="10" fill="#eee" stroke="#111" stroke-width="0.8"/><rect x="995" y="608" width="27" height="10" fill="#0040ff"/>
<text x="1151" y="600" class="k" text-anchor="end"></text>
<text x="1175" y="600" class="k" text-anchor="end">15%</text>
<text x="20" y="634" class="s">Percentages are my judgement of design items built and exercised, not a measured score.</text>
</svg>
</body></html>
